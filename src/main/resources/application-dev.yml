server:
  port: 8080
spring:
  application:
    name: HMoneta
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    # 默认指向本地 Docker 测试库（docker run -d --name hmoneta-pg -e POSTGRES_USER=hmoneta
    # -e POSTGRES_PASSWORD=hmoneta -e POSTGRES_DB=hmoneta -p 5432:5432 postgres:16-alpine），
    # 环境变量可覆盖
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hmoneta}
    username: ${DB_USERNAME:hmoneta}
    password: ${DB_PASSWORD:hmoneta}

    hikari:
      pool-name: HomeLabPostgreSQLPool        # 设置连接池名称
      maximum-pool-size: 20                   # 最大连接数
      minimum-idle: 5                         # 最小空闲连接数
      connection-timeout: 30000               # 连接超时 (30秒)
      idle-timeout: 600000                    # 空闲超时 (10分钟)
      max-lifetime: 1800000                   # 连接最大生命周期 (30分钟)
      leak-detection-threshold: 60000         # 连接泄漏检测
      connection-test-query: SELECT 1         # 连接测试查询
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 20

  task:
    scheduling:
      pool:
        size: 1
      thread-name-prefix: HMScheduling-
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

logging:
  level:
    sql: info

jwt:
  secret: povTvh!U7e9aJCwLUmp^qIVRCrgOAa=a
  expiration: 86400
acme:
  url: https://acme-staging-v02.api.letsencrypt.org/directory